name: Screenshots

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android-API-Stufe für den Emulator"
        required: false
        default: "34"
        type: string

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Debug-APK bauen
        run: ./gradlew assembleDebug
      - name: KVM-Berechtigung für den Emulator setzen
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator starten, Bildschirmfotos aufnehmen (Beispieldaten)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/bilder.sh
      - name: Bildschirmfotos hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dammapp-bilder
          path: |
            bilder/*.png
            logcat.txt
